# High-density polyethylene (HDPE), monomer C2H4
schema: fuel/1
name: hdpe
display_name: "HDPE (high-density polyethylene)"
density:
  value: 970.0            # [kg/m^3]
  source: "HRAP HDPE.mat (prop_Rho); typical datasheet range 940-970"
  verify: false
composition:              # per monomer unit
  C: 2
  H: 4
composition_source: "Polyethylene repeat unit (C2H4)n"
enthalpy_of_formation:        # [J/mol] per composition formula unit (C2H4) = 2 x CH2
  value: -56.364e+03
  source: >-
    Splitstone & Johnson, "Enthalpies of combustion and formation of linear
    polyethylene", J. Res. NBS 78A(5), 611-616 (1974), doi:10.6028/jres.078A.038:
    dHf(298.15 K) = -28.182 +/- 0.134 kJ/mol CH2 (72 % crystalline NBS SRM 1475;
    -29.070 for 96 %). x2 per C2H4. For comparison NASA CEA thermo.inp
    '(CH2)x(cr)' (McBride 1996) uses -25.600 kJ/mol CH2 (~7 K lower Tc at O/F 6.5).
    v0.1 used -41.2 kJ/mol (gas-phase group-additivity estimate) - wrong phase.
  verify: false
regression:
  - oxidizer: n2o
    model: power_law
    a: 1.04e-4            # HRAP value 0.104 interpreted as mm/s basis -> SI
    n: 0.352
    m: 0.0
    flux_basis: oxidizer
    source: "HRAP HDPE.mat (prop_Reg = [0.104, 0.352, 0]); units CONFIRMED via HRAP propellant_template.m: rdot mm/s, G kg/m^2/s, L m"
    verify: true
notes: >
  Selected fuel of the prusak_v2 1 kN engine (project pivot paraffin -> PE).
  Low regression rate vs paraffin; check port count/length consequences.
