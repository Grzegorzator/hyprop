[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprop"
version = "0.1.0"
description = "Hybrid Rocket Preliminary Sizing & Analysis Environment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MASSLACZEK12" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pint>=0.22",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
cea = ["rocketcea>=1.2"]
cantera = ["cantera>=3.0"]
props = ["CoolProp>=6.6"]
opt = ["pymoo>=0.6", "SALib>=1.4"]
export = ["openpyxl>=3.1", "reportlab>=4.0"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7.4", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["hyprop*"]

[tool.setuptools.package-data]
"hyprop.data" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
