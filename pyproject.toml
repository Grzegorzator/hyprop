[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprop"
version = "0.2.0"
description = "Hybrid Rocket Preliminary Sizing & Analysis Environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MASSLACZEK12" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pint>=0.22",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
cea = ["rocketcea>=1.2"]
cantera = ["cantera>=3.0"]
props = ["CoolProp>=6.6"]
opt = ["pymoo>=0.6", "SALib>=1.4"]
export = ["openpyxl>=3.1", "jinja2>=3.1.2"]
validation = ["cea>=3.3"]

[dependency-groups]
# uv: `uv sync` installs the dev group by default.
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "hypothesis>=6.0",
    "ruff>=0.15",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["hyprop*"]

[tool.setuptools.package-data]
"hyprop.data" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import shared fixtures as `tests.<module>`
pythonpath = ["."]
markers = [
    "slow: long-running tests (golden references); deselect with -m 'not slow'",
]
filterwarnings = [
    # GRI-Mech NASA polynomials are fitted to 3000 K; hybrid chamber
    # equilibria (~3300 K) extrapolate them marginally (cross-checked
    # against NASA CEA to 0.15 %, docs/VALIDATION.md).
    "ignore:.*outside valid range.*:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["outputs"]

[tool.ruff.lint]
# Explicit rule set: ruff's default selection changes between versions.
select = ["E", "F", "W", "I", "UP", "B", "D"]
# D105/D107: magic methods and __init__ are documented on the class.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the library; scripts and tests are exempt.
"tests/**" = ["D"]
"validation/**" = ["D"]
"examples/**" = ["D"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# NASA `cea` ships a .pyi stub that is not valid Python syntax.
module = ["cea", "cea.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
